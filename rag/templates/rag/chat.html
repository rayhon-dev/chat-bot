<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Chat Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f0f13;
            color: #e4e4e7;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 260px;
            background: #17171c;
            border-right: 1px solid #2a2a32;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        #sidebar h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #sidebar h1 .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #6366f1; box-shadow: 0 0 8px #6366f1;
        }
        .upload-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-bottom: 14px;
            transition: background 0.15s;
        }
        .upload-btn:hover { background: #4f46e5; }
        #file-input { display: none; }

        #doc-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .doc-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #a1a1aa;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }
        .doc-item:hover { background: #1f1f27; color: #e4e4e7; }
        .doc-item.active {
            background: rgba(99,102,241,0.12);
            border-color: rgba(99,102,241,0.4);
            color: #c7d2fe;
        }
        #upload-status {
            font-size: 12px;
            color: #6ee7b7;
            margin-bottom: 10px;
            min-height: 14px;
        }

        /* Main chat area */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a32;
            font-size: 14px;
            color: #a1a1aa;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .empty-state {
            margin: auto;
            text-align: center;
            color: #52525b;
            font-size: 14px;
        }
        .message { display: flex; }
        .message.user { justify-content: flex-end; }
        .bubble {
            max-width: 65%;
            padding: 11px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.user .bubble {
            background: #6366f1;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot .bubble {
            background: #1f1f27;
            color: #e4e4e7;
            border-bottom-left-radius: 4px;
        }

        #input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid #2a2a32;
        }
        .input-row {
            display: flex;
            gap: 10px;
            background: #1a1a20;
            border: 1px solid #2a2a32;
            border-radius: 12px;
            padding: 6px;
        }
        #question-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e4e4e7;
            font-size: 14px;
            padding: 8px 10px;
        }
        #question-input::placeholder { color: #52525b; }
        #send-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        #send-btn:hover { background: #4f46e5; }
        #send-btn:disabled { background: #3f3f46; cursor: not-allowed; }

        #chat-box::-webkit-scrollbar, #doc-list::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb, #doc-list::-webkit-scrollbar-thumb {
            background: #2a2a32; border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1><span class="dot"></span> Chat Bot</h1>
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">+ Fayl yuklash</button>
        <input type="file" id="file-input" accept=".txt,.pdf,.docx" onchange="uploadFile()">
        <p id="upload-status"></p>
        <div id="doc-list"></div>
    </div>

    <div id="main">
        <div id="chat-header">Fayl tanlanmagan</div>
        <div id="chat-box">
            <div class="empty-state">Chapdan fayl tanlang yoki yangi fayl yuklang</div>
        </div>
        <div id="input-area">
            <div class="input-row">
                <input type="text" id="question-input" placeholder="Savolingizni yozing..." disabled
                       onkeypress="if(event.key==='Enter') askQuestion()">
                <button id="send-btn" onclick="askQuestion()" disabled>Yuborish</button>
            </div>
        </div>
    </div>

    <script>
        let currentDocId = null;
        let documents = [];

        async function loadDocuments() {
            const res = await fetch('/api/documents/');
            documents = await res.json();
            renderDocList();
        }

        function renderDocList() {
            const listEl = document.getElementById('doc-list');
            listEl.innerHTML = '';
            documents.forEach(doc => {
                const el = document.createElement('div');
                el.className = 'doc-item' + (doc.id === currentDocId ? ' active' : '');
                el.textContent = doc.title;
                el.onclick = () => selectDocument(doc.id, doc.title);
                listEl.appendChild(el);
            });
        }

        async function selectDocument(docId, title) {
            currentDocId = docId;
            renderDocList();
            document.getElementById('chat-header').innerText = title;
            document.getElementById('question-input').disabled = false;
            document.getElementById('send-btn').disabled = false;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';

            const res = await fetch(`/api/messages/${docId}/`);
            const messages = await res.json();

            if (messages.length === 0) {
                chatBox.innerHTML = '<div class="empty-state">Savol berishni boshlang</div>';
            } else {
                messages.forEach(m => {
                    appendMessage(m.question, 'user');
                    appendMessage(m.answer, 'bot');
                });
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById('chat-box');
            const emptyState = chatBox.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const msgEl = document.createElement('div');
            msgEl.className = `message ${type}`;
            msgEl.innerHTML = `<div class="bubble"></div>`;
            msgEl.querySelector('.bubble').innerText = text;
            chatBox.appendChild(msgEl);
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('upload-status').innerText = "Yuklanmoqda...";

            const response = await fetch('/api/upload/', { method: 'POST', body: formData });
            const data = await response.json();

            document.getElementById('upload-status').innerText = `Tayyor — ${data.chunks_count} ta chunk`;
            fileInput.value = '';

            await loadDocuments();
            selectDocument(data.document_id, data.title);
        }

        async function askQuestion() {
            const input = document.getElementById('question-input');
            const question = input.value.trim();
            if (!question || !currentDocId) return;

            appendMessage(question, 'user');
            input.value = '';
            document.getElementById('send-btn').disabled = true;

            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch('/api/ask/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ document_id: currentDocId, question: question })
            });
            const data = await response.json();

            appendMessage(data.answer, 'bot');
            chatBox.scrollTop = chatBox.scrollHeight;
            document.getElementById('send-btn').disabled = false;
        }

        loadDocuments();
    </script>
</body>
</html>
